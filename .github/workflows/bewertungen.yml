# Holt einmal täglich die aktuelle Google-Bewertung und speichert sie für die Website.
# Einrichtung: Repository-Secret GOOGLE_PLACES_API_KEY anlegen (siehe README).
name: Google-Bewertungen aktualisieren

on:
  schedule:
    - cron: '17 4 * * *'   # täglich ca. 6 Uhr deutscher Zeit
  workflow_dispatch:        # auf Wunsch sofort starten: Actions → Run workflow

permissions:
  contents: write
  pages: write

concurrency:
  group: bewertungen
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bewertung bei Google abrufen
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_PLACE_ID: ${{ vars.GOOGLE_PLACE_ID }}
        run: node tools/bewertungen.mjs

      - name: Speichern und Website neu veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- assets/data/bewertungen.json; then
            echo "Keine Änderung."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/bewertungen.json
          git commit -m "Google-Bewertung aktualisiert"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null || echo "Pages-Build startet automatisch."
